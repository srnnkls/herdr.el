name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ['29.1', '30.1', '31.1']
        experimental: [false]
        include:
          - os: ubuntu-latest
            emacs-version: snapshot
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: emacs-eask/setup-eask@master
        with:
          version: snapshot

      - name: Install dependencies
        run: eask install-deps --dev

      - name: Compile
        run: eask compile

      - name: Compile tests
        run: eask compile herdr-tests.el herdr-agent-tests.el herdr-transient-tests.el herdr-status-tests.el --clean

      - name: Test
        run: eask run script test

      - name: Lint
        run: |
          eask lint checkdoc --strict
          eask lint declare --strict
          eask lint package --strict
          eask lint indent --strict
          eask lint regexps --strict
          eask lint keywords --strict
